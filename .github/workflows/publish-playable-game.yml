name: Publish Coin Mountain playable build

on:
  workflow_dispatch:
  push:
    branches:
      - codex/coin-mountain-aaa-graphics

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out game
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Coin_Mountain_GitHub_Upload/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: Coin_Mountain_GitHub_Upload
      - name: Build game
        run: npm run build
        working-directory: Coin_Mountain_GitHub_Upload
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload playable site
        uses: actions/upload-pages-artifact@v3
        with:
          path: Coin_Mountain_GitHub_Upload/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish playable game
        id: deployment
        uses: actions/deploy-pages@v4
